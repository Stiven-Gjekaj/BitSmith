<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Bitsmith">
  <title>Bitsmith</title>

  <defs>
    <linearGradient id="spark" x1="20" y1="16" x2="76" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38e8ff"/>
      <stop offset="1" stop-color="#7c6cff"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#04060c"/>
    </linearGradient>
  </defs>

  <!-- The ground is drawn in, so the mark reads on a light page and a dark
       one without a second file. -->
  <rect width="96" height="96" rx="22" fill="url(#ground)"/>
  <rect x="0.75" y="0.75" width="94.5" height="94.5" rx="21.25" fill="none"
        stroke="#1c2739" stroke-width="1.5"/>

  <!-- The bit: the thing being worked. -->
  <rect x="28" y="52" width="40" height="24" rx="5" fill="none"
        stroke="#8b99b1" stroke-width="4.5"/>

  <!-- The blow: the arc a hammer travels, stopping over the bit. -->
  <path d="M22 40 L48 20 L74 40" fill="none" stroke="url(#spark)"
        stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- The spark, where the two meet. -->
  <circle cx="48" cy="64" r="5" fill="url(#spark)"/>
</svg>
